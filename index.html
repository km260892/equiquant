<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equiquant Capital - Trading Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f1419;
            color: #ffffff;
            min-height: 100vh;
        }

        .topbar {
            background: #1a1f2e;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0 40px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .strategy-name {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 2px solid #2a2f3e;
            padding-left: 20px;
            font-weight: 600;
        }

        .live-badge {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 30px 40px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmin(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1a1f2e 0%, #252b3b 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
        }

        .stat-label {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, rgba(255, 255, 255, 0.8) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .stat-change {
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .positive {
            color: #10b981;
        }

        .negative {
            color: #ef4444;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .chart-card {
            background: linear-gradient(135deg, #1a1f2e 0%, #252b3b 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
        }

        .chart-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #00d4ff;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .table-container {
            background: linear-gradient(135deg, #1a1f2e 0%, #252b3b 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            border-bottom: 2px solid rgba(0, 212, 255, 0.2);
        }

        th {
            text-align: left;
            padding: 12px;
            font-weight: 600;
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .direction-badge {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .long-badge {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .short-badge {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .closed-badge {
            background: rgba(107, 114, 128, 0.1);
            color: #6b7280;
        }

        .open-badge {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
            font-size: 1.1rem;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 212, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .topbar {
                padding: 15px 20px;
                height: auto;
                flex-direction: column;
                gap: 15px;
            }

            .logo-section {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .strategy-name {
                border-left: none;
                padding-left: 0;
            }

            .container {
                padding: 20px;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <!-- Top Bar -->
    <div class="topbar">
        <div class="logo-section">
            <div class="logo">EQUIQUANT CAPITAL</div>
            <div class="strategy-name">Continuous Flow Regime Switch Long/Short Strategy</div>
        </div>
        <div class="live-badge">● LIVE</div>
    </div>

    <div class="container">
        <!-- Loading State -->
        <div id="loadingState" class="loading">
            <div class="loading-spinner"></div>
            Loading trading data from Google Sheets...
        </div>

        <!-- Error State -->
        <div id="errorState" class="error-message" style="display: none;">
            <strong>⚠️ Error Loading Data</strong>
            <p id="errorMessage"></p>
        </div>

        <!-- Main Content -->
        <div id="mainContent" style="display: none;">
            <!-- Stats Grid -->
            <div class="stats-grid" id="statsGrid"></div>
            
            <!-- Charts -->
            <div class="charts-grid">
                <div class="chart-card">
                    <div class="chart-title">Equity Curve</div>
                    <canvas id="equityChart"></canvas>
                </div>
                <div class="chart-card">
                    <div class="chart-title">Win/Loss Distribution</div>
                    <canvas id="winLossChart"></canvas>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-card">
                    <div class="chart-title">Monthly Returns</div>
                    <canvas id="monthlyChart"></canvas>
                </div>
                <div class="chart-card">
                    <div class="chart-title">Long vs Short Performance</div>
                    <canvas id="directionChart"></canvas>
                </div>
            </div>

            <!-- Recent Trades Table -->
            <div class="table-container">
                <div class="chart-title">All Trades</div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>DATE</th>
                            <th>DIRECTION</th>
                            <th>ENTRY</th>
                            <th>EXIT</th>
                            <th>P&L</th>
                            <th>RETURN %</th>
                            <th>STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="tradesBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxzGggVKuYfv9sqa27Hstbcc2UPrsKYdLuYXuf4pQkTHuEOVI5iw3wpfI6aRwZ24ZcC/exec';
        
        let trades = [];
        let charts = {};

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            await loadTrades();
        });

        // Load trades from Google Sheets
        async function loadTrades() {
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch data from Google Sheets');
                }
                
                trades = await response.json();
                trades = trades.filter(t => t.id && t.id !== ''); // Remove empty rows
                
                console.log('Loaded trades:', trades);
                
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                
                updateDashboard();
            } catch (error) {
                console.error('Error loading trades:', error);
                showError('Failed to load trading data: ' + error.message);
            }
        }

        // Update entire dashboard
        function updateDashboard() {
            updateStats();
            updateCharts();
            updateTradesTable();
        }

        // Update statistics cards
        function updateStats() {
            const totalTrades = trades.length;
            const closedTrades = trades.filter(t => t.status === 'CLOSED');
            const openTrades = trades.filter(t => t.status === 'OPEN');
            
            const totalPnL = trades.reduce((sum, t) => sum + parseFloat(t.pnl || 0), 0);
            const winningTrades = closedTrades.filter(t => parseFloat(t.pnl || 0) > 0).length;
            const losingTrades = closedTrades.filter(t => parseFloat(t.pnl || 0) < 0).length;
            const winRate = closedTrades.length > 0 ? (winningTrades / closedTrades.length * 100) : 0;
            
            const avgWin = winningTrades > 0 
                ? closedTrades.filter(t => parseFloat(t.pnl || 0) > 0).reduce((sum, t) => sum + parseFloat(t.pnl), 0) / winningTrades 
                : 0;
            const avgLoss = losingTrades > 0 
                ? closedTrades.filter(t => parseFloat(t.pnl || 0) < 0).reduce((sum, t) => sum + parseFloat(t.pnl), 0) / losingTrades 
                : 0;
            const profitFactor = avgLoss !== 0 ? Math.abs(avgWin / avgLoss) : 0;
            
            const longTrades = closedTrades.filter(t => t.direction === 'Long');
            const shortTrades = closedTrades.filter(t => t.direction === 'Short');
            const longPnL = longTrades.reduce((sum, t) => sum + parseFloat(t.pnl || 0), 0);
            const shortPnL = shortTrades.reduce((sum, t) => sum + parseFloat(t.pnl || 0), 0);

            const statsHTML = `
                <div class="stat-card">
                    <div class="stat-label">TOTAL TRADES</div>
                    <div class="stat-value">${totalTrades}</div>
                    <div class="stat-change">${closedTrades.length} Closed · ${openTrades.length} Open</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">TOTAL P&L</div>
                    <div class="stat-value ${totalPnL >= 0 ? 'positive' : 'negative'}">₹${totalPnL.toFixed(2)}</div>
                    <div class="stat-change ${totalPnL >= 0 ? 'positive' : 'negative'}">
                        ${totalPnL >= 0 ? '↑' : '↓'} ${Math.abs(totalPnL).toFixed(2)}
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">WIN RATE</div>
                    <div class="stat-value">${winRate.toFixed(1)}%</div>
                    <div class="stat-change">${winningTrades}W · ${losingTrades}L</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">PROFIT FACTOR</div>
                    <div class="stat-value">${profitFactor.toFixed(2)}</div>
                    <div class="stat-change">Avg Win: ₹${avgWin.toFixed(2)}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">LONG PERFORMANCE</div>
                    <div class="stat-value ${longPnL >= 0 ? 'positive' : 'negative'}">₹${longPnL.toFixed(2)}</div>
                    <div class="stat-change">${longTrades.length} Trades</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">SHORT PERFORMANCE</div>
                    <div class="stat-value ${shortPnL >= 0 ? 'positive' : 'negative'}">₹${shortPnL.toFixed(2)}</div>
                    <div class="stat-change">${shortTrades.length} Trades</div>
                </div>
            `;
            
            document.getElementById('statsGrid').innerHTML = statsHTML;
        }

        // Update all charts
        function updateCharts() {
            updateEquityChart();
            updateWinLossChart();
            updateMonthlyChart();
            updateDirectionChart();
        }

        // Equity Curve Chart
        function updateEquityChart() {
            const ctx = document.getElementById('equityChart').getContext('2d');
            
            if (charts.equity) charts.equity.destroy();
            
            const sortedTrades = [...trades].sort((a, b) => new Date(a.date) - new Date(b.date));
            let equity = 0;
            const equityData = sortedTrades.map(t => {
                equity += parseFloat(t.pnl || 0);
                return { date: t.date, equity: equity };
            });
            
            charts.equity = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: equityData.map(d => d.date),
                    datasets: [{
                        label: 'Equity',
                        data: equityData.map(d => d.equity),
                        borderColor: '#00d4ff',
                        backgroundColor: 'rgba(0, 212, 255, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#6b7280' }
                        },
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#6b7280', maxTicksLimit: 10 }
                        }
                    }
                }
            });
        }

        // Win/Loss Chart
        function updateWinLossChart() {
            const ctx = document.getElementById('winLossChart').getContext('2d');
            
            if (charts.winLoss) charts.winLoss.destroy();
            
            const closedTrades = trades.filter(t => t.status === 'CLOSED');
            const wins = closedTrades.filter(t => parseFloat(t.pnl || 0) > 0).length;
            const losses = closedTrades.filter(t => parseFloat(t.pnl || 0) < 0).length;
            
            charts.winLoss = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Wins', 'Losses'],
                    datasets: [{
                        data: [wins, losses],
                        backgroundColor: ['#10b981', '#ef4444'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#ffffff', padding: 20 }
                        }
                    }
                }
            });
        }

        // Monthly Returns Chart
        function updateMonthlyChart() {
            const ctx = document.getElementById('monthlyChart').getContext('2d');
            
            if (charts.monthly) charts.monthly.destroy();
            
            const monthlyData = {};
            trades.forEach(t => {
                if (!t.date) return;
                const month = t.date.substring(0, 7); // YYYY-MM
                monthlyData[month] = (monthlyData[month] || 0) + parseFloat(t.pnl || 0);
            });
            
            const sortedMonths = Object.keys(monthlyData).sort();
            
            charts.monthly = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sortedMonths,
                    datasets: [{
                        label: 'Monthly P&L',
                        data: sortedMonths.map(m => monthlyData[m]),
                        backgroundColor: sortedMonths.map(m => monthlyData[m] >= 0 ? '#10b981' : '#ef4444'),
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#6b7280' }
                        },
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#6b7280' }
                        }
                    }
                }
            });
        }

        // Direction Performance Chart
        function updateDirectionChart() {
            const ctx = document.getElementById('directionChart').getContext('2d');
            
            if (charts.direction) charts.direction.destroy();
            
            const longPnL = trades.filter(t => t.direction === 'Long').reduce((sum, t) => sum + parseFloat(t.pnl || 0), 0);
            const shortPnL = trades.filter(t => t.direction === 'Short').reduce((sum, t) => sum + parseFloat(t.pnl || 0), 0);
            
            charts.direction = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Long', 'Short'],
                    datasets: [{
                        label: 'P&L by Direction',
                        data: [longPnL, shortPnL],
                        backgroundColor: ['#10b981', '#ef4444'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#6b7280' }
                        },
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#6b7280' }
                        }
                    }
                }
            });
        }

        // Update trades table
        function updateTradesTable() {
            const tbody = document.getElementById('tradesBody');
            tbody.innerHTML = '';
            
            if (trades.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px; color: #6b7280;">No trades found</td></tr>';
                return;
            }
            
            const sortedTrades = [...trades].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            sortedTrades.forEach(trade => {
                const pnl = parseFloat(trade.pnl || 0);
                const returnPct = trade.exit && trade.entry 
                    ? (trade.direction === 'Long' 
                        ? ((trade.exit - trade.entry) / trade.entry * 100)
                        : ((trade.entry - trade.exit) / trade.entry * 100))
                    : 0;
                
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${trade.id}</td>
                    <td>${trade.date}</td>
                    <td><span class="direction-badge ${trade.direction === 'Long' ? 'long-badge' : 'short-badge'}">${trade.direction}</span></td>
                    <td>₹${parseFloat(trade.entry).toFixed(2)}</td>
                    <td>${trade.exit ? '₹' + parseFloat(trade.exit).toFixed(2) : '-'}</td>
                    <td class="${pnl >= 0 ? 'positive' : 'negative'}">${pnl >= 0 ? '+' : ''}₹${pnl.toFixed(2)}</td>
                    <td class="${returnPct >= 0 ? 'positive' : 'negative'}">${returnPct >= 0 ? '+' : ''}${returnPct.toFixed(2)}%</td>
                    <td><span class="status-badge ${trade.status === 'OPEN' ? 'open-badge' : 'closed-badge'}">${trade.status}</span></td>
                `;
            });
        }

        // Show error
        function showError(message) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
            document.getElementById('errorMessage').textContent = message;
        }
    </script>
</body>
</html>
