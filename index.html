<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EquiQuant - Premium Trading Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1400px;
            width: 100%;
            overflow: hidden;
        }

        /* Login Screen */
        .login-screen {
            padding: 60px;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .login-screen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .login-screen p {
            font-size: 18px;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .login-form {
            max-width: 400px;
            margin: 0 auto;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            background: rgba(255,255,255,0.9);
        }

        .role-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .role-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .role-btn:hover {
            background: white;
            color: #667eea;
        }

        .role-btn.active {
            background: white;
            color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #667eea;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .login-btn:hover {
            transform: scale(1.05);
        }

        /* Dashboard Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 32px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logout-btn {
            padding: 10px 20px;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: white;
            color: #667eea;
        }

        /* Dashboard Content */
        .dashboard-content {
            padding: 40px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 36px;
            font-weight: bold;
        }

        /* Trade Form */
        .trade-form {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 40px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .submit-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        /* Trades Table */
        .trades-section {
            margin-top: 40px;
        }

        .trades-section h2 {
            margin-bottom: 20px;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th, td {
            padding: 15px;
            text-align: left;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .profit {
            color: #10b981;
            font-weight: bold;
        }

        .loss {
            color: #ef4444;
            font-weight: bold;
        }

        .delete-btn {
            padding: 5px 15px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #667eea;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="loginScreen" class="login-screen">
            <h1>🚀 EquiQuant</h1>
            <p>Premium Trading Dashboard</p>
            
            <div class="login-form">
                <div class="role-selector">
                    <button class="role-btn active" onclick="selectRole('public')">Public View</button>
                    <button class="role-btn" onclick="selectRole('admin')">Admin Access</button>
                </div>
                
                <div id="adminInputs" class="hidden">
                    <div class="input-group">
                        <input type="text" id="username" placeholder="Username">
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" placeholder="Password">
                    </div>
                </div>
                
                <button class="login-btn" onclick="login()">Enter Dashboard</button>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="hidden">
            <div class="header">
                <h1>📊 EquiQuant Trading Dashboard</h1>
                <div class="user-info">
                    <span id="userRole"></span>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>

            <div class="dashboard-content">
                <!-- Stats Cards -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total Trades</h3>
                        <div class="value" id="totalTrades">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>Total P&L</h3>
                        <div class="value" id="totalPnL">₹0</div>
                    </div>
                    <div class="stat-card">
                        <h3>Win Rate</h3>
                        <div class="value" id="winRate">0%</div>
                    </div>
                    <div class="stat-card">
                        <h3>Active Trades</h3>
                        <div class="value" id="activeTrades">0</div>
                    </div>
                </div>

                <!-- Trade Form (Admin Only) -->
                <div id="tradeForm" class="trade-form hidden">
                    <h2>📝 Add New Trade</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="tradeDate" required>
                        </div>
                        <div class="form-group">
                            <label>Stock Symbol</label>
                            <input type="text" id="stockSymbol" placeholder="e.g., NIFTY" required>
                        </div>
                        <div class="form-group">
                            <label>Type</label>
                            <select id="tradeType" required>
                                <option value="Long">Long (BUY)</option>
                                <option value="Short">Short (SELL)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Entry Price (₹)</label>
                            <input type="number" id="entryPrice" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label>Exit Price (₹)</label>
                            <input type="number" id="exitPrice" step="0.01">
                        </div>
                        <div class="form-group">
                            <label>Quantity</label>
                            <input type="number" id="quantity" value="1" required>
                        </div>
                        <div class="form-group">
                            <label>Status</label>
                            <select id="tradeStatus" required>
                                <option value="OPEN">OPEN</option>
                                <option value="CLOSED">CLOSED</option>
                            </select>
                        </div>
                    </div>
                    <button class="submit-btn" onclick="addTrade()">Add Trade</button>
                </div>

                <!-- Trades Table -->
                <div class="trades-section">
                    <h2>📈 Recent Trades</h2>
                    <div id="loadingMessage" class="loading">Loading trades from Google Sheets...</div>
                    <div id="errorMessage" class="error-message hidden"></div>
                    <div id="successMessage" class="success-message hidden"></div>
                    <table id="tradesTable" class="hidden">
                        <thead>
                            <tr>
                                <th>Trade ID</th>
                                <th>Date</th>
                                <th>Stock</th>
                                <th>Type</th>
                                <th>Entry</th>
                                <th>Exit</th>
                                <th>Quantity</th>
                                <th>P&L</th>
                                <th>Status</th>
                                <th id="actionHeader" class="hidden">Action</th>
                            </tr>
                        </thead>
                        <tbody id="tradesTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Google Apps Script URL - Already configured!
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxzGggVKuYfv9sqa27Hstbcc2UPrsKYdLuYXuf4pQkTHuEOVI5iw3wpfI6aRwZ24ZcC/exec';
        
        let currentRole = 'public';
        let trades = [];

        // Admin credentials
        const ADMIN_USERNAME = 'KM3699';
        const ADMIN_PASSWORD = 'equikshitij';

        // Role selection
        function selectRole(role) {
            currentRole = role;
            const buttons = document.querySelectorAll('.role-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const adminInputs = document.getElementById('adminInputs');
            if (role === 'admin') {
                adminInputs.classList.remove('hidden');
            } else {
                adminInputs.classList.add('hidden');
            }
        }

        // Login function
        function login() {
            if (currentRole === 'admin') {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                    showDashboard('admin');
                } else {
                    alert('Invalid credentials!');
                }
            } else {
                showDashboard('public');
            }
        }

        // Show dashboard
        function showDashboard(role) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('userRole').textContent = role === 'admin' ? '👤 Admin' : '👥 Public View';
            
            if (role === 'admin') {
                document.getElementById('tradeForm').classList.remove('hidden');
                document.getElementById('actionHeader').classList.remove('hidden');
            }
            
            loadTrades();
        }

        // Logout function
        function logout() {
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('tradeForm').classList.add('hidden');
            document.getElementById('actionHeader').classList.add('hidden');
        }

        // Load trades from Google Sheets
        async function loadTrades() {
            try {
                showLoading(true);
                hideError();
                hideSuccess();
                
                const response = await fetch(GOOGLE_SCRIPT_URL);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch trades from Google Sheets');
                }
                
                trades = await response.json();
                console.log('Loaded trades:', trades);
                
                displayTrades();
                updateStats();
                
                showLoading(false);
                document.getElementById('tradesTable').classList.remove('hidden');
            } catch (error) {
                console.error('Error loading trades:', error);
                showError('Failed to load trades: ' + error.message + '. Please make sure the Google Apps Script is deployed correctly.');
                showLoading(false);
            }
        }

        // Add new trade
        async function addTrade() {
            const tradeDate = document.getElementById('tradeDate').value;
            const stockSymbol = document.getElementById('stockSymbol').value.toUpperCase();
            const tradeType = document.getElementById('tradeType').value;
            const entryPrice = parseFloat(document.getElementById('entryPrice').value);
            const exitPrice = parseFloat(document.getElementById('exitPrice').value) || 0;
            const quantity = parseInt(document.getElementById('quantity').value);
            const tradeStatus = document.getElementById('tradeStatus').value;

            if (!tradeDate || !stockSymbol || !entryPrice || !quantity) {
                alert('Please fill in all required fields!');
                return;
            }

            const trade = {
                action: 'add',
                id: Date.now(),
                date: tradeDate,
                stock: stockSymbol,
                type: tradeType,
                entry: entryPrice,
                exit: exitPrice,
                quantity: quantity,
                status: tradeStatus
            };

            // Calculate P&L
            if (exitPrice > 0) {
                if (tradeType === 'Long') {
                    trade.pnl = (exitPrice - entryPrice) * quantity;
                } else {
                    trade.pnl = (entryPrice - exitPrice) * quantity;
                }
            } else {
                trade.pnl = 0;
            }

            try {
                hideError();
                hideSuccess();
                
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(trade)
                });

                if (!response.ok) {
                    throw new Error('Failed to add trade');
                }

                // Clear form
                document.getElementById('tradeDate').value = new Date().toISOString().split('T')[0];
                document.getElementById('stockSymbol').value = '';
                document.getElementById('entryPrice').value = '';
                document.getElementById('exitPrice').value = '';
                document.getElementById('quantity').value = '1';

                // Reload trades
                await loadTrades();
                showSuccess('Trade added successfully!');
            } catch (error) {
                console.error('Error adding trade:', error);
                showError('Failed to add trade: ' + error.message);
            }
        }

        // Delete trade
        async function deleteTrade(id) {
            if (confirm('Are you sure you want to delete this trade?')) {
                try {
                    hideError();
                    hideSuccess();
                    
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'delete',
                            id: id
                        })
                    });

                    await loadTrades();
                    showSuccess('Trade deleted successfully!');
                } catch (error) {
                    console.error('Error deleting trade:', error);
                    showError('Failed to delete trade: ' + error.message);
                }
            }
        }

        // Display trades in table
        function displayTrades() {
            const tbody = document.getElementById('tradesTableBody');
            tbody.innerHTML = '';

            if (trades.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align: center; padding: 40px;">No trades found. Add your first trade!</td></tr>';
                return;
            }

            trades.slice().reverse().forEach(trade => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${trade.id}</td>
                    <td>${trade.date}</td>
                    <td><strong>${trade.stock}</strong></td>
                    <td>${trade.type}</td>
                    <td>₹${parseFloat(trade.entry).toFixed(2)}</td>
                    <td>${trade.exit ? '₹' + parseFloat(trade.exit).toFixed(2) : '-'}</td>
                    <td>${trade.quantity}</td>
                    <td class="${trade.pnl >= 0 ? 'profit' : 'loss'}">
                        ${trade.pnl >= 0 ? '+' : ''}₹${parseFloat(trade.pnl).toFixed(2)}
                    </td>
                    <td>${trade.status}</td>
                    ${currentRole === 'admin' ? `
                        <td><button class="delete-btn" onclick="deleteTrade(${trade.id})">Delete</button></td>
                    ` : ''}
                `;
            });
        }

        // Update statistics
        function updateStats() {
            const totalTrades = trades.length;
            const totalPnL = trades.reduce((sum, trade) => sum + parseFloat(trade.pnl || 0), 0);
            const profitableTrades = trades.filter(t => parseFloat(t.pnl || 0) > 0).length;
            const winRate = totalTrades > 0 ? (profitableTrades / totalTrades * 100).toFixed(1) : 0;
            const activeTrades = trades.filter(t => t.status === 'OPEN').length;

            document.getElementById('totalTrades').textContent = totalTrades;
            document.getElementById('totalPnL').textContent = '₹' + totalPnL.toFixed(2);
            document.getElementById('totalPnL').className = 'value ' + (totalPnL >= 0 ? 'profit' : 'loss');
            document.getElementById('winRate').textContent = winRate + '%';
            document.getElementById('activeTrades').textContent = activeTrades;
        }

        // Helper functions
        function showLoading(show) {
            document.getElementById('loadingMessage').classList.toggle('hidden', !show);
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.add('hidden');
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.remove('hidden');
            setTimeout(() => {
                successDiv.classList.add('hidden');
            }, 3000);
        }

        function hideSuccess() {
            document.getElementById('successMessage').classList.add('hidden');
        }

        // Set today's date as default
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            const dateInput = document.getElementById('tradeDate');
            if (dateInput) {
                dateInput.value = today;
            }
        });
    </script>
</body>
</html>
