<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equiquant Capital - Trading Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f1419;
            color: #ffffff;
            min-height: 100vh;
        }

        .topbar {
            background: #1a1f2e;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0 40px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .status-badge {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-info {
            text-align: right;
        }

        .user-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .user-role {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .logout-btn {
            background: rgba(255, 59, 59, 0.1);
            color: #ff3b3b;
            border: 1px solid rgba(255, 59, 59, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 59, 59, 0.2);
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 40px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: #1a1f2e;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
        }

        .stat-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
            margin-bottom: 12px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, rgba(255, 255, 255, 0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-change {
            font-size: 0.85rem;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .positive {
            color: #00ff88;
        }

        .negative {
            color: #ff3b3b;
        }

        .section {
            background: #1a1f2e;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .add-trade-btn {
            background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .add-trade-btn:hover {
            transform: translateY(-2px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            text-align: left;
            padding: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .direction-badge {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .long-badge {
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .short-badge {
            background: rgba(255, 59, 59, 0.1);
            color: #ff3b3b;
            border: 1px solid rgba(255, 59, 59, 0.2);
        }

        .status-badge-table {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .closed-badge {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
        }

        .open-badge {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
        }

        /* Login Screen */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
        }

        .login-box {
            background: #1a1f2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .login-logo {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .login-subtitle {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
        }

        .role-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .role-tab {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .role-tab.active {
            background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 100%);
            color: white;
            border-color: transparent;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
        }

        .input-group input:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        .hidden {
            display: none !important;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.5);
        }

        .error-message {
            background: rgba(255, 59, 59, 0.1);
            color: #ff3b3b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 59, 59, 0.2);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1f2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.6;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .submit-trade-btn {
            grid-column: 1 / -1;
            padding: 15px;
            background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .delete-btn {
            background: rgba(255, 59, 59, 0.1);
            color: #ff3b3b;
            border: 1px solid rgba(255, 59, 59, 0.2);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .delete-btn:hover {
            background: rgba(255, 59, 59, 0.2);
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <div class="login-logo">EQUIQUANT</div>
            <div class="login-subtitle">Capital Trading Platform</div>
            
            <div class="role-tabs">
                <button class="role-tab active" onclick="selectRole('public')">Public View</button>
                <button class="role-tab" onclick="selectRole('admin')">Admin Access</button>
            </div>
            
            <div id="adminInputs" class="hidden">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Username">
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password">
                </div>
            </div>
            
            <button class="login-btn" onclick="login()">Enter Platform</button>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
        <div class="topbar">
            <div class="logo-section">
                <div class="logo">EQUIQUANT</div>
                <div class="status-badge">● LIVE</div>
            </div>
            <div class="user-section">
                <div class="user-info">
                    <div class="user-name" id="userName">User</div>
                    <div class="user-role" id="userRole">Public View</div>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="container">
            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">TOTAL TRADES</div>
                    <div class="stat-value" id="totalTrades">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">TOTAL P&L</div>
                    <div class="stat-value" id="totalPnL">₹0</div>
                    <div class="stat-change" id="totalPnLChange"></div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">WIN RATE</div>
                    <div class="stat-value" id="winRate">0%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">ACTIVE TRADES</div>
                    <div class="stat-value" id="activeTrades">0</div>
                </div>
            </div>

            <!-- Trades Section -->
            <div class="section">
                <div class="section-header">
                    <h2 class="section-title">Trade History</h2>
                    <button id="addTradeBtn" class="add-trade-btn hidden" onclick="openAddTradeModal()">+ Add Trade</button>
                </div>
                
                <div id="loadingMessage" class="loading">Loading trades...</div>
                <div id="errorMessage" class="error-message hidden"></div>
                
                <table id="tradesTable" class="hidden">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>DATE</th>
                            <th>DIRECTION</th>
                            <th>ENTRY</th>
                            <th>EXIT</th>
                            <th>P&L</th>
                            <th>STATUS</th>
                            <th id="actionColumn" class="hidden">ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="tradesTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Trade Modal -->
    <div id="addTradeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Add New Trade</h2>
                <button class="close-btn" onclick="closeAddTradeModal()">×</button>
            </div>
            
            <form onsubmit="addTrade(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Direction</label>
                        <select id="tradeDirection" required>
                            <option value="Long">Long</option>
                            <option value="Short">Short</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Entry Price</label>
                        <input type="number" id="entryPrice" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Exit Price (optional)</label>
                        <input type="number" id="exitPrice" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="tradeStatus" required>
                            <option value="OPEN">OPEN</option>
                            <option value="CLOSED">CLOSED</option>
                        </select>
                    </div>
                    <button type="submit" class="submit-trade-btn">Add Trade</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Configuration
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxzGggVKuYfv9sqa27Hstbcc2UPrsKYdLuYXuf4pQkTHuEOVI5iw3wpfI6aRwZ24ZcC/exec';
        const ADMIN_USERNAME = 'KM3699';
        const ADMIN_PASSWORD = 'equikshitij';

        let currentRole = 'public';
        let trades = [];

        // Role selection
        function selectRole(role) {
            currentRole = role;
            document.querySelectorAll('.role-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            const adminInputs = document.getElementById('adminInputs');
            if (role === 'admin') {
                adminInputs.classList.remove('hidden');
            } else {
                adminInputs.classList.add('hidden');
            }
        }

        // Login
        function login() {
            if (currentRole === 'admin') {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                    showDashboard('admin');
                } else {
                    alert('Invalid credentials!');
                }
            } else {
                showDashboard('public');
            }
        }

        // Show dashboard
        function showDashboard(role) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            
            if (role === 'admin') {
                document.getElementById('userName').textContent = 'Admin';
                document.getElementById('userRole').textContent = 'Administrator';
                document.getElementById('addTradeBtn').classList.remove('hidden');
                document.getElementById('actionColumn').classList.remove('hidden');
            } else {
                document.getElementById('userName').textContent = 'Visitor';
                document.getElementById('userRole').textContent = 'Public View';
            }
            
            loadTrades();
        }

        // Logout
        function logout() {
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('addTradeBtn').classList.add('hidden');
            document.getElementById('actionColumn').classList.add('hidden');
        }

        // Load trades
        async function loadTrades() {
            try {
                document.getElementById('loadingMessage').classList.remove('hidden');
                document.getElementById('errorMessage').classList.add('hidden');
                
                const response = await fetch(GOOGLE_SCRIPT_URL);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch trades');
                }
                
                trades = await response.json();
                console.log('Loaded trades:', trades);
                
                displayTrades();
                updateStats();
                
                document.getElementById('loadingMessage').classList.add('hidden');
                document.getElementById('tradesTable').classList.remove('hidden');
            } catch (error) {
                console.error('Error loading trades:', error);
                showError('Failed to load trades: ' + error.message);
                document.getElementById('loadingMessage').classList.add('hidden');
            }
        }

        // Display trades
        function displayTrades() {
            const tbody = document.getElementById('tradesTableBody');
            tbody.innerHTML = '';

            if (trades.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px; color: rgba(255,255,255,0.5);">No trades found</td></tr>';
                return;
            }

            trades.slice().reverse().forEach(trade => {
                const row = tbody.insertRow();
                const pnl = parseFloat(trade.pnl || 0);
                const pnlClass = pnl >= 0 ? 'positive' : 'negative';
                
                row.innerHTML = `
                    <td>${trade.id}</td>
                    <td>${trade.date}</td>
                    <td><span class="direction-badge ${trade.direction === 'Long' ? 'long-badge' : 'short-badge'}">${trade.direction}</span></td>
                    <td>₹${parseFloat(trade.entry).toFixed(2)}</td>
                    <td>${trade.exit ? '₹' + parseFloat(trade.exit).toFixed(2) : '-'}</td>
                    <td class="${pnlClass}">${pnl >= 0 ? '+' : ''}₹${pnl.toFixed(2)}</td>
                    <td><span class="status-badge-table ${trade.status === 'OPEN' ? 'open-badge' : 'closed-badge'}">${trade.status}</span></td>
                    ${currentRole === 'admin' ? `
                        <td><button class="delete-btn" onclick="deleteTrade(${trade.id})">Delete</button></td>
                    ` : ''}
                `;
            });
        }

        // Update statistics
        function updateStats() {
            const totalTrades = trades.length;
            const totalPnL = trades.reduce((sum, trade) => sum + parseFloat(trade.pnl || 0), 0);
            const profitableTrades = trades.filter(t => parseFloat(t.pnl || 0) > 0).length;
            const winRate = totalTrades > 0 ? (profitableTrades / totalTrades * 100).toFixed(1) : 0;
            const activeTrades = trades.filter(t => t.status === 'OPEN').length;

            document.getElementById('totalTrades').textContent = totalTrades;
            document.getElementById('totalPnL').textContent = '₹' + totalPnL.toFixed(2);
            
            const pnlChange = document.getElementById('totalPnLChange');
            pnlChange.textContent = (totalPnL >= 0 ? '↑ ' : '↓ ') + Math.abs(totalPnL).toFixed(2);
            pnlChange.className = 'stat-change ' + (totalPnL >= 0 ? 'positive' : 'negative');
            
            document.getElementById('winRate').textContent = winRate + '%';
            document.getElementById('activeTrades').textContent = activeTrades;
        }

        // Modal functions
        function openAddTradeModal() {
            document.getElementById('addTradeModal').classList.add('active');
        }

        function closeAddTradeModal() {
            document.getElementById('addTradeModal').classList.remove('active');
        }

        // Add trade
        async function addTrade(event) {
            event.preventDefault();
            
            const direction = document.getElementById('tradeDirection').value;
            const entryPrice = parseFloat(document.getElementById('entryPrice').value);
            const exitPrice = parseFloat(document.getElementById('exitPrice').value) || 0;
            const status = document.getElementById('tradeStatus').value;

            const trade = {
                action: 'add',
                id: Date.now(),
                date: new Date().toISOString().split('T')[0],
                direction: direction,
                entry: entryPrice,
                exit: exitPrice,
                status: status
            };

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(trade)
                });

                closeAddTradeModal();
                
                // Clear form
                document.getElementById('entryPrice').value = '';
                document.getElementById('exitPrice').value = '';
                
                await loadTrades();
                alert('Trade added successfully!');
            } catch (error) {
                console.error('Error adding trade:', error);
                alert('Failed to add trade: ' + error.message);
            }
        }

        // Delete trade
        async function deleteTrade(id) {
            if (confirm('Are you sure you want to delete this trade?')) {
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'delete',
                            id: id
                        })
                    });

                    await loadTrades();
                    alert('Trade deleted successfully!');
                } catch (error) {
                    console.error('Error deleting trade:', error);
                    alert('Failed to delete trade: ' + error.message);
                }
            }
        }

        // Show error
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
